# Tests on every push and pull request: Rust workspace, web UI, admin panel, docs build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo.lock in step with Cargo.toml
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null 2>&1; then
            echo "::error::Cargo.lock is stale (version bump without refreshing the lock?). Run scripts/bump-version.sh <version> or 'cargo update --workspace' and commit Cargo.lock."
            exit 1
          fi
      - run: cargo test --workspace --locked

  frontend:
    name: Web UI, admin panel, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Web UI
        working-directory: web
        run: npm ci && npm run lint && npm test && npm run build
      - name: Admin panel
        working-directory: admin
        run: npm ci && npm run lint && npm test && npm run build
      - name: Docs
        working-directory: docs
        run: npm ci && npm run build

  installer:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning scripts/install.sh scripts/build-web-ui.sh Data/run-job.sh entrypoint.sh
